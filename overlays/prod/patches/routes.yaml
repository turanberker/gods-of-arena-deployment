# Gateway yönlendirmelerinin üretim alan adları (base'de goa.local / admin.goa.local).
# goa.example.com yer tutucudur. Liste tamamen değiştirilir.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goa-api
spec:
  hostnames:
    - goa.example.com
    - admin.goa.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goa-web
spec:
  hostnames:
    - goa.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goa-admin
spec:
  hostnames:
    - admin.goa.example.com
