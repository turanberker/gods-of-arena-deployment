apiVersion: v1
kind: Service
metadata:
  name: battle
  labels:
    app.kubernetes.io/name: battle
    app.kubernetes.io/part-of: gods-of-arena
spec:
  selector:
    app.kubernetes.io/name: battle
  ports:
    - name: http
      port: 9005
      targetPort: http
---
# Çok kopya: kuyruk, maç sahipliği (kira) ve kopyalar arası WebSocket aktarımı Redis'tedir; yapışkan
# oturum gerekmez. Kapanan pod maçlarının kirasını bırakır, diğer kopya maçı hamle kaydından devralır
# ve istemci 1001 sonrası yeniden bağlanır. BATTLE_NODE_ID verilmez: sunucu "pod adı-rastgele" üretir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: battle
  labels:
    app.kubernetes.io/name: battle
    app.kubernetes.io/part-of: gods-of-arena
spec:
  # Kopya sayısını HPA yönetir (en az 2); apply her seferinde sıfırlamasın diye burada yazılmaz.
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: battle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: battle
        app.kubernetes.io/part-of: gods-of-arena
    spec:
      # Sunucu SIGTERM sonrası en fazla 15 sn içinde kapanır (preStop 5 sn + kapanış).
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: battle
      securityContext:
        runAsNonRoot: true
      containers:
        - name: battle
          image: berkerturan/goa-battle
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9005
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: goa-config, key: POSTGRES_USER }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: goa-config, key: POSTGRES_DB }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: goa-secrets, key: POSTGRES_PASSWORD }
            # Parolada URL'de özel anlamı olan karakter (@ : / ?) varsa URL-encode edilmiş hâli kullanılmalı.
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef: { name: goa-config, key: REDIS_ADDR }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: goa-secrets, key: REDIS_PASSWORD }
            - name: HEROES_URL
              valueFrom:
                configMapKeyRef: { name: goa-config, key: HEROES_URL }
            - name: INVENTORY_URL
              valueFrom:
                configMapKeyRef: { name: goa-config, key: INVENTORY_URL }
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef: { name: goa-config, key: KAFKA_BROKERS }
            - name: ARENA_ENTRY_FEE
              valueFrom:
                configMapKeyRef: { name: goa-config, key: ARENA_ENTRY_FEE }
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef: { name: goa-secrets, key: INTERNAL_API_TOKEN }
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef: { name: goa-config, key: ALLOWED_ORIGINS }
            - name: BATTLE_PORT
              value: "9005"
          readinessProbe:
            httpGet: { path: /battle/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /battle/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          lifecycle:
            # Service uç noktalarından çıkarılmayı bekle; yeni bağlantılar kapanan pod'a düşmesin.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: battle
  labels:
    app.kubernetes.io/name: battle
    app.kubernetes.io/part-of: gods-of-arena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: battle
  minReplicas: 2
  maxReplicas: 5
  # Küçülürken kapanan pod'un maçları diğer kopyalara devredilir; toplu devri önlemek için dakikada bir pod azaltılır.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: battle
  labels:
    app.kubernetes.io/name: battle
    app.kubernetes.io/part-of: gods-of-arena
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: battle
