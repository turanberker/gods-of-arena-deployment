# Gizli olmayan ortak ayarlar. Parolalar goa-secrets içindedir (secrets.env).
apiVersion: v1
kind: ConfigMap
metadata:
  name: goa-config
data:
  POSTGRES_DB: gods_of_arena
  POSTGRES_USER: goa
  DB_URL: jdbc:postgresql://postgres:5432/gods_of_arena
  DB_USER: goa
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_ADDR: redis:6379
  HEROES_URL: http://heroes:9002
  INVENTORY_URL: http://inventory:9004
  CRAFTING_URL: http://crafting:9003
  MARKET_URL: http://market:9006
  # Maç sonucu olayları (battle outbox -> heroes, inventory). Java KAFKA_BOOTSTRAP_SERVERS, Go KAFKA_BROKERS okur.
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_BROKERS: kafka:9092
  # Oyuncu başına arena giriş ücreti (altın).
  ARENA_ENTRY_FEE: "50"
  # Beraberlikte her oyuncuya iade edilen ücret yüzdesi (kalanı oyundan çıkar).
  ARENA_DRAW_REFUND_PERCENT: "80"
  GEMINI_MODEL: gemini-2.5-flash-lite
  # HTTPS arkasında true yapın.
  GOA_COOKIE_SECURE: "false"
  # Go WebSocket Origin kontrolü: tarayıcının açtığı adresler.
  ALLOWED_ORIGINS: http://goa.local,http://admin.goa.local
  # Gateway arkasında X-Forwarded-* başlıkları dikkate alınır; kapanışta istekler tamamlanır.
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  SERVER_SHUTDOWN: graceful
  JAVA_OPTS: -XX:MaxRAMPercentage=75
