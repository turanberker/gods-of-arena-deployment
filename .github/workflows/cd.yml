# Sürekli dağıtım: main'e her push'ta (veya elle) sunucuya SSH ile bağlanır,
# bu reponun sunucudaki kopyasında `git pull` yapar ve compose/.env dosyasını
# DEPLOY_ENV_FILE secret'ının içeriğiyle yeniden yazar. Başka bir şey yapmaz
# (imaj çekme / container yeniden başlatma yok).
#
# Gerekli secret'lar (Settings → Secrets and variables → Actions → Secrets):
#   SSH_HOST         sunucu adresi (IP veya alan adı)
#   SSH_USER         SSH kullanıcısı
#   SSH_KEY          özel anahtarın tamamı (-----BEGIN ... END----- dahil)
#   DEPLOY_ENV_FILE  compose/.env dosyasının tam içeriği. Secret ya da Variable
#                    olabilir; secret varsa o kullanılır. Variable seçilirse içerik
#                    GitHub arayüzünden görülebilir ve düzenlenebilir.
# İsteğe bağlı:
#   SSH_PORT         secret; boşsa 22
#   DEPLOY_PATH      variable (Variables sekmesi); boşsa /root/gods-of-arena-deployment
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Aynı anda iki dağıtım çalışmasın; yenisi gelirse eskisi beklesin.
concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  pull:
    name: sunucuda git pull
    runs-on: ubuntu-latest
    steps:
      # Çok satırlı .env içeriği SSH betiğine güvenle taşınsın diye base64'e çevrilir
      # (tırnak, $ ve satır sonları bozulmaz). Base64 hali de loglarda maskelenir.
      - name: env dosyasını hazırla
        id: envfile
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE || vars.DEPLOY_ENV_FILE }}
        run: |
          if [ -z "$DEPLOY_ENV_FILE" ]; then
            echo "::error::DEPLOY_ENV_FILE (secret veya variable) tanımlı değil."
            exit 1
          fi
          # Variable olarak tanımlandıysa GitHub otomatik maskelemez; her satırın
          # değeri loglarda maskelensin.
          while IFS= read -r line; do
            val=${line#*=}
            if [ "$val" != "$line" ] && [ ${#val} -ge 4 ]; then echo "::add-mask::$val"; fi
          done <<< "$DEPLOY_ENV_FILE"
          b64=$(printf '%s\n' "$DEPLOY_ENV_FILE" | base64 -w0)
          echo "::add-mask::$b64"
          echo "b64=$b64" >> "$GITHUB_OUTPUT"

      - name: SSH ile pull
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_B64: ${{ steps.envfile.outputs.b64 }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/gods-of-arena-deployment' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: ENV_B64,DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git pull --ff-only
            umask 077
            printf '%s' "$ENV_B64" | base64 -d > compose/.env.tmp
            mv compose/.env.tmp compose/.env
            echo "Güncel commit: $(git log -1 --format='%h %s')"
